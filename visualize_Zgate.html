<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Z gate on the Bloch sphere</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 2rem;
  }
  button {
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f0f0f0; }
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;align-items:center;gap:1rem">
  <svg id="sph" width="340" height="340" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#999" stroke-width="1"/>
    <ellipse cx="200" cy="200" rx="150" ry="40" fill="none" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 3"/>
    <line x1="50" y1="200" x2="350" y2="200" stroke="#ccc" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="200" y2="350" stroke="#ccc" stroke-width="0.5"/>
    <text x="358" y="204" font-size="12" fill="#555">+X</text>
    <text x="200" y="42" text-anchor="middle" font-size="12" fill="#555">|0&#10217;</text>
    <text x="200" y="366" text-anchor="middle" font-size="12" fill="#555">|1&#10217;</text>
    <text x="60" y="220" text-anchor="end" font-size="12" fill="#555">-X</text>

    <line id="vec" x1="200" y1="200" x2="350" y2="200"
          stroke="#D85A30" stroke-width="2.5" marker-end="url(#ah)" stroke-linecap="round"/>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="#D85A30"/>
      </marker>
    </defs>
    <circle id="tip" cx="350" cy="200" r="6" fill="#D85A30"/>
  </svg>

  <div id="label" style="font-size:14px;color:#555">State: |+&#10217; (equator, pointing along +X)</div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button onclick="setState(0)">|0&#10217;</button>
    <button onclick="setState(180)">|1&#10217;</button>
    <button onclick="setPhi(0)">|+&#10217;</button>
    <button onclick="setPhi(180)">|-&#10217;</button>
    <button onclick="setPhi(90)">|i&#10217;</button>
    <button onclick="setPhi(270)">|-i&#10217;</button>
  </div>

  <button onclick="applyZ()" style="border-color:#378ADD;color:#185FA5;font-weight:600">
    Apply Z gate
  </button>

  <div id="note" style="font-size:12px;color:#777;text-align:center;max-width:320px"></div>
</div>

<script>
  // theta = polar angle from north pole (|0>), 0-180 degrees
  // phi   = azimuthal angle around the equator, 0-360 degrees
  let theta = 90, phi = 0;

  function project(th, ph) {
    const r = 150;
    const x = 200 + r * Math.sin(th * Math.PI / 180) * Math.cos(ph * Math.PI / 180);
    const y = 200 - r * Math.cos(th * Math.PI / 180);
    return [x, y];
  }

  function render() {
    const [x, y] = project(theta, phi);
    document.getElementById('vec').setAttribute('x2', x);
    document.getElementById('vec').setAttribute('y2', y);
    document.getElementById('tip').setAttribute('cx', x);
    document.getElementById('tip').setAttribute('cy', y);

    const lbl = document.getElementById('label');
    const note = document.getElementById('note');

    if (theta === 0) {
      lbl.textContent = 'State: |0\u27e9 (north pole)';
      note.textContent = 'Z acts as a phase gate: it leaves |0\u27e9 exactly in place on the sphere.';
    } else if (theta === 180) {
      lbl.textContent = 'State: |1\u27e9 (south pole)';
      note.textContent = 'Z leaves |1\u27e9 in place too, but multiplies it by a phase of -1 \u2014 invisible in position, but real.';
    } else {
      lbl.textContent = 'State on equator, phi = ' + phi + '\u00b0';
      note.textContent = 'Z rotates the state 180\u00b0 around the vertical (Z) axis \u2014 the equator point flips straight through the center.';
    }
  }

  function setState(t) {
    theta = t;
    render();
  }

  function setPhi(p) {
    theta = 90;
    phi = p;
    render();
  }

  function applyZ() {
    const vec = document.getElementById('vec');
    const tip = document.getElementById('tip');
    vec.style.transition = 'all 0.5s ease';
    tip.style.transition = 'all 0.5s ease';
    phi = (phi + 180) % 360; // Z: (x, y, z) -> (-x, -y, z)
    render();
  }

  render();
</script>

</body>
</html>
